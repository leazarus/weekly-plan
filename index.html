<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساعت هفتگی من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-free:   #EDEBE3;
    --color-bg:     #FFFFFF;
    --color-card:   #FAF9F6;
    --color-border: #DAD8CF;
    --color-text:   #222222;
    --color-muted:  #767469;
    --color-danger: #B23B3B;
    --color-accent: #0F6E56;
  }
  [data-theme="dark"] {
    --color-free:   #2A2A2A;
    --color-bg:     #000000;
    --color-card:   #161616;
    --color-border: #333333;
    --color-text:   #EDEDED;
    --color-muted:  #999999;
    --color-danger: #E05C5C;
    --color-accent: #1FA187;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Vazirmatn", "Tahoma", "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px 60px;
    transition: background .2s, color .2s;
  }
  .wrap { max-width: 360px; width: 100%; }
  .topBar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  #gearBtn, #themeBtn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--color-border);
    background: var(--color-card); font-size: 18px; cursor: pointer;
  }
  .topBar .rightBtns { display: flex; gap: 8px; }
  #dayTabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  #dayTabs button {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--color-border);
    background: var(--color-card); color: var(--color-text);
    font-size: 14px; cursor: pointer;
  }
  #dayTabs button.active { color: #ffffff; border-color: transparent; }
  .clockBox { position: relative; width: 300px; height: 300px; margin: 0 auto; }
  #clockFace {
    width: 300px; height: 300px; border-radius: 50%;
    background-color: var(--color-card);
    border: 1px solid var(--color-border);
  }
  #hourMarks { position: absolute; inset: 0; pointer-events: none; }
  .tick { position: absolute; top: 50%; left: 50%; width: 1px; height: 7px; background: var(--color-border); }
  .tick.major { height: 10px; background: var(--color-muted); }
  .hourLabel { position: absolute; font-size: 11px; color: var(--color-muted); text-align: center; line-height: 1.3; white-space: nowrap; }
  .hourLabel .ampm { display: block; font-size: 9px; color: var(--color-accent); }
  #centerLabel { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
  #dayName { font-size: 15px; font-weight: 600; }
  #dayTotal { font-size: 12px; color: var(--color-muted); margin-top: 2px; }

  #legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; margin-top: 18px; }
  .legendItem { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-muted); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  #dayList { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .listRow { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .todoCheck { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--color-accent); cursor: pointer; }
  body { padding-bottom: 90px; }
  .card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  #tabBar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; padding: 8px 12px 12px; background: var(--color-bg); border-top: 1px solid var(--color-border); z-index: 40; }
  #tabBar button { flex: 1; max-width: 110px; padding: 9px 4px; border-radius: 12px; border: none; background: transparent; color: var(--color-muted); font-size: 12px; font-family: inherit; cursor: pointer; }
  #tabBar button.active { background: var(--color-accent); color: #fff; }
  .dayCard { display: flex; gap: 12px; align-items: flex-start; }
  .ring { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .ckRow { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .freqTag { font-size: 10px; color: var(--color-muted); border: 1px solid var(--color-border); border-radius: 8px; padding: 1px 6px; margin-right: auto; }
  .emptyNote { font-size: 13px; color: var(--color-muted); text-align: center; padding: 8px 0; }

  /* panel */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh;
    background: var(--color-bg); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
    transform: translateY(100%); transition: transform .25s ease;
    display: flex; flex-direction: column; z-index: 50;
  }
  #panel.open { transform: translateY(0); }
  .panelHeader {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--color-border); font-weight: 600;
  }
  .panelHeader button { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--color-muted); }
  .panelBody { padding: 14px 18px 28px; overflow-y: auto; }
  .panelBody section { margin-bottom: 26px; }
  .panelBody h3 { font-size: 14px; margin: 0 0 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; }
  .field input[type=text], .field input:not([type]), .field select {
    padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px; font-size: 13px;
    font-family: inherit; background: var(--color-card); color: var(--color-text);
  }
  .row2 { display: flex; gap: 8px; }
  .row2 .field { flex: 1; }
  .freqRow { display: flex; gap: 14px; font-size: 13px; align-items: center; }
  .btn {
    padding: 9px 14px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer;
    background: var(--color-accent); color: #fff; font-family: inherit;
  }
  .btn.secondary { background: var(--color-card); color: var(--color-text); border: 1px solid var(--color-border); }
  .btn.danger { background: var(--color-danger); color: #fff; }
  .btnRow { display: flex; gap: 8px; margin-top: 6px; }
  .catRow, .taskRow {
    display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 13px;
    border-bottom: 1px solid var(--color-border);
  }
  .catRow:last-child, .taskRow:last-child { border-bottom: none; }
  .catRow .swatch, .taskRow .swatch { width: 12px; height: 12px; }
  .iconBtn { background: none; border: none; font-size: 15px; cursor: pointer; margin-right: 4px; }
  .grow { flex: 1; }
  .taskMeta { font-size: 11px; color: var(--color-muted); }

  /* ===== Violet Dusk theme ===== */
  :root{--color-bg:#F8F4E9;--color-card:#FFFDF8;--color-border:#EBDCC8;--color-text:#3A2142;--color-muted:#8D7289;--color-accent:#935073;--color-free:#F1E6D6;--color-danger:#C4505E;--glow:rgba(246,219,192,.9);--shadow:0 10px 28px rgba(80,45,85,.14),inset 0 1px 0 rgba(255,255,255,.8);--tabOn:rgba(147,80,115,.14)}
  [data-theme="dark"]{--color-bg:#1B1023;--color-card:#2A1A35;--color-border:#493054;--color-text:#F8F4E9;--color-muted:#B7A0B3;--color-accent:#B0668C;--color-free:#36233F;--color-danger:#E8808F;--glow:rgba(80,45,85,.75);--shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(246,219,192,.08);--tabOn:rgba(246,219,192,.12)}
  body{background:radial-gradient(900px 520px at 25% -8%,var(--glow),transparent 70%),var(--color-bg);background-attachment:fixed;padding-bottom:120px}
  .card{border-radius:22px;border-color:transparent;box-shadow:var(--shadow)}
  #clockFace{box-shadow:var(--shadow),inset 0 6px 18px rgba(80,45,85,.12)}
  .btn{border-radius:999px;padding:9px 18px;background:linear-gradient(145deg,var(--color-accent),#502D55);box-shadow:0 6px 16px rgba(147,80,115,.35)}
  .btn.secondary{background:var(--color-card);color:var(--color-text);box-shadow:var(--shadow);border-color:transparent}
  .btn.danger{background:var(--color-danger);color:#fff}
  .btn,#dayTabs button,#tabBar button{transition:transform .15s,box-shadow .15s}
  .btn:active{transform:scale(.97)}
  #gearBtn,#themeBtn,#dayTabs button{box-shadow:var(--shadow);border-color:transparent}
  .field input[type=text],.field input[type=time],.field input:not([type]),.field select{border-radius:999px;padding:9px 14px;box-shadow:inset 0 2px 6px rgba(80,45,85,.14);border-color:transparent;background:var(--color-bg);color:var(--color-text)}
  .freqTag{border-radius:999px;background:var(--tabOn);border:0;color:var(--color-accent)}
  .legendItem{background:var(--color-card);box-shadow:var(--shadow);border-radius:999px;padding:4px 10px}
  #panel{border-radius:28px 28px 0 0}
  #tabBar{left:14px;right:14px;bottom:14px;max-width:380px;margin:0 auto;padding:0;background:transparent;border:0;display:block;filter:drop-shadow(0 12px 22px rgba(40,15,50,.28))}
  #tabBar .bar{display:flex;align-items:center;height:66px;border-radius:26px;background:var(--color-card);-webkit-mask:radial-gradient(circle 37px at 50% 4px,transparent 36px,#000 37px);mask:radial-gradient(circle 37px at 50% 4px,transparent 36px,#000 37px)}
  #tabBar .gap{flex:0 0 76px}
  #tabBar .bar button{flex:1;max-width:none;display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 2px;padding:6px 0;border-radius:16px;font-size:11px}
  #tabBar .bar button b{font-size:18px;font-weight:400;filter:grayscale(1);opacity:.6}
  #tabBar .bar button.active{background:var(--tabOn);color:var(--color-accent);font-weight:700}
  #tabBar .bar button.active b{filter:none;opacity:1}
  #tabBar .fab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:56px;height:56px;max-width:none;padding:0;border-radius:50%;border:0;background:linear-gradient(145deg,#935073,#502D55);color:#F8F4E9;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 8px 18px rgba(80,45,85,.45)}
  #tabBar .fab:active{transform:translateX(-50%) scale(.94)}
  .ideaIn{width:100%;padding:9px 14px;border:0;border-radius:16px;background:var(--color-bg);color:var(--color-text);font-family:inherit;font-size:13px;box-shadow:inset 0 2px 6px rgba(80,45,85,.14);box-sizing:border-box;resize:vertical}
  select.ideaIn{width:auto}
  #tabBar .fab.active{box-shadow:0 0 0 5px var(--tabOn),0 8px 18px rgba(80,45,85,.45)}
  @property --nx { syntax: '<length>'; inherits: true; initial-value: 50px; }
  #tabBar .bar { transition: --nx .4s cubic-bezier(.5,1.3,.5,1); -webkit-mask: radial-gradient(circle 37px at var(--nx) 4px, transparent 36px, #000 37px); mask: radial-gradient(circle 37px at var(--nx) 4px, transparent 36px, #000 37px); }
  #tabBar .bar button { margin: 6px 0; }
  #tabBar .bar button.active { background: transparent; }
  #tabBar .bar button b { transition: opacity .2s, transform .3s; }
  #tabBar .bar button.active b { opacity: 0; transform: translateY(10px); }
  #tabBar .fab { display: flex; align-items: center; justify-content: center; pointer-events: none; transition: left .4s cubic-bezier(.5,1.3,.5,1); }
  .inputRow { position: relative; }
  .field .inputRow input[type=text] { padding-left: 54px; width: 100%; box-sizing: border-box; }
  .addBtn { position: absolute; left: 5px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; padding: 0; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .addBtn:active { transform: translateY(-50%) scale(.94); }
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrap">
  <div class="topBar">
    <h1>ساعت هفتگی من</h1>
    <div class="rightBtns">
      <button id="themeBtn" title="تغییر تم">🌙</button>
      <button id="gearBtn" title="پنل مدیریت">⚙️</button>
    </div>
  </div>

  <div id="pageSchedule">
  <div id="dayTabs"></div>

  <div class="clockBox">
    <div id="clockFace"></div>
    <div id="hourMarks"></div>
    <div id="centerLabel">
      <div id="dayName"></div>
      <div id="dayTotal"></div>
    </div>
  </div>

  <div id="legend"></div>
  <div id="dayList"></div>
  </div>

  <div id="pageTodo" style="display:none;">
    <div class="card" id="weekSummary"></div>
    <form id="todoForm" class="card">
      <div class="field"><label>کار جدید (خارج از برنامه)</label><div class="inputRow"><input type="text" id="todoTitle" required placeholder="مثلاً: خرید کتاب"><button type="submit" class="btn addBtn">+</button></div></div>
      <div class="field" style="margin-bottom:0"><label>روز</label><select id="todoDay"></select></div>
    </form>
    <div id="todoDays"></div>
  </div>

  <div id="pageNot" style="display:none;">
    <form id="notForm" class="card">
      <div class="field" style="margin-bottom:0"><label>چیزی که نباید انجام بدی</label><div class="inputRow"><input type="text" id="notTitle" required placeholder="مثلاً: گوشی بعد از بیدار شدن"><button type="submit" class="btn addBtn">+</button></div></div>
    </form>
    <div id="notList"></div>
  </div>

  <div id="pageIdeas" style="display:none;">
    <div class="card" id="ideasSummary"></div>
    <div id="ideasList"></div>
  </div>
</div>

<nav id="tabBar">
  <div class="bar">
    <button data-page="Schedule"><b>🕐</b>برنامه</button>
    <button data-page="Ideas"><b>💡</b>ایده‌ها</button>
    <button data-page="Todo"><b>✅</b>تودو</button>
    <button data-page="Not"><b>🚫</b>ناتودو</button>
    <button id="navPanel"><b>⚙️</b>مدیریت</button>
  </div>
  <span class="fab" id="fab">🕐</span>
</nav>
<div id="overlay"></div>
<div id="panel">
  <div class="panelHeader">
    <span>⚙️ پنل مدیریت</span>
    <button id="closePanel">✕</button>
  </div>
  <div class="panelBody">

    <section>
      <h3>🏷️ دسته‌بندی‌ها</h3>
      <div id="categoryList"></div>
      <form id="categoryForm" class="row2" style="margin-top:10px; align-items:flex-end;">
        <div class="field grow">
          <label>نام دسته‌بندی جدید</label>
          <input type="text" id="catName" required placeholder="مثلاً: کار، ورزش">
        </div>
        <div class="field">
          <label>🎨 رنگ</label>
          <input type="color" id="catColor" value="#3B6FB2">
        </div>
        <button type="submit" class="btn">افزودن</button>
      </form>
    </section>

    <section>
      <h3 id="taskFormTitle">➕ افزودن کار / کلاس</h3>
      <form id="taskForm">
        <div class="field">
          <label>عنوان</label>
          <input type="text" id="taskTitle" required placeholder="مثلاً: باشگاه">
        </div>
        <div class="field">
          <label>🏷️ دسته‌بندی</label>
          <select id="taskCategory" required></select>
        </div>
        <div class="field">
          <label>📅 روز</label>
          <select id="taskDay"></select>
        </div>
        <div class="row2">
          <div class="field">
            <label>⏰ ساعت شروع (دقیق)</label>
            <input type="time" id="taskStart" required>
          </div>
          <div class="field">
            <label>⏰ ساعت پایان (دقیق)</label>
            <input type="time" id="taskEnd" required>
          </div>
        </div>
        <div class="field">
          <label>🔄 تکرار</label>
          <div class="freqRow">
            <label><input type="radio" name="freq" value="weekly" checked> هر هفته</label>
            <label><input type="radio" name="freq" value="even"> هفته زوج</label>
          </div>
        </div>
        <div class="btnRow">
          <button type="submit" class="btn" id="taskSubmitBtn">افزودن</button>
          <button type="button" class="btn secondary" id="taskCancelEdit" style="display:none;">انصراف از ویرایش</button>
        </div>
      </form>
    </section>

    <section>
      <h3>📋 همه‌ی کارها</h3>
      <div id="taskListAll"></div>
    </section>

    <section>
      <h3>📤 خروجی / ورودی گرفتن از داده‌ها</h3>
      <div class="btnRow">
        <button id="exportBtn" class="btn secondary">📤 خروجی گرفتن (Export)</button>
        <button id="importBtn" class="btn secondary">📥 وارد کردن (Import)</button>
      </div>
      <p style="font-size:11px; color:var(--color-muted); margin-top:8px; line-height:1.6;">
        با «خروجی گرفتن» یه متن می‌گیری که همه‌ی کارها و دسته‌بندی‌های فعلیت رو داره — می‌تونی جایی ذخیره‌ش کنی یا برای من بفرستی تا توی کد اصلی وارد کنم.
      </p>
    </section>

    <section>
      <button id="resetBtn" class="btn danger">🔄 بازگردانی به برنامه اولیه</button>
    </section>

  </div>
</div>

<div id="confirmOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:120; padding:20px;">
  <div style="background:var(--color-bg); border:1px solid var(--color-border); border-radius:14px; padding:22px 20px; max-width:280px; width:100%; text-align:center;">
    <p id="confirmMsg" style="font-size:14px; color:var(--color-text); margin:0 0 18px; line-height:1.6;"></p>
    <div id="confirmBtns" style="display:flex; gap:8px; justify-content:center;"></div>
  </div>
</div>

<div id="dataOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:110; padding:20px;">
  <div style="background:var(--color-bg); border:1px solid var(--color-border); border-radius:14px; padding:18px; max-width:320px; width:100%;">
    <p id="dataModalTitle" style="font-size:13px; font-weight:600; margin:0 0 10px; color:var(--color-text);"></p>
    <textarea id="dataTextarea" style="width:100%; height:160px; font-family:monospace; font-size:11px; padding:8px; border:1px solid var(--color-border); border-radius:8px; background:var(--color-card); color:var(--color-text); direction:ltr; resize:vertical; box-sizing:border-box;"></textarea>
    <div style="display:flex; gap:8px; margin-top:10px; justify-content:flex-end;">
      <button id="dataModalCancel" class="btn secondary">بستن</button>
      <button id="dataModalAction" class="btn"></button>
    </div>
  </div>
</div>

<script>
/* ---------- تنظیمات پایه ---------- */
const STORAGE_KEY = "weeklyClockData_v1";
const FA_DAYS = ["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنج‌شنبه","جمعه"];
const fa = n => n.toString().replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const pct = h => (h/24*100).toFixed(2) + "%";
const genId = () => "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const timeToHours = str => {
  const [h,m] = str.split(":").map(Number);
  return h + (m || 0) / 60;
};
const hoursToTime = h => {
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  return String(hh).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
};
const faTime = h => {
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  return fa(String(hh).padStart(2,"0")) + ":" + fa(String(mm).padStart(2,"0"));
};

/* ---------- تأیید/هشدار سفارشی (بدون confirm/alert بومی مرورگر) ---------- */
const confirmOverlay = document.getElementById("confirmOverlay");
const confirmMsgEl = document.getElementById("confirmMsg");
const confirmBtnsEl = document.getElementById("confirmBtns");
function showConfirm(message) {
  return new Promise(resolve => {
    confirmMsgEl.textContent = message;
    confirmBtnsEl.innerHTML = "";
    const yes = document.createElement("button");
    yes.className = "btn danger"; yes.textContent = "بله، حذف کن";
    const no = document.createElement("button");
    no.className = "btn secondary"; no.textContent = "انصراف";
    confirmBtnsEl.appendChild(yes); confirmBtnsEl.appendChild(no);
    confirmOverlay.style.display = "flex";
    const close = result => { confirmOverlay.style.display = "none"; resolve(result); };
    yes.onclick = () => close(true);
    no.onclick = () => close(false);
    confirmOverlay.onclick = e => { if (e.target === confirmOverlay) close(false); };
  });
}
function showAlert(message) {
  confirmMsgEl.textContent = message;
  confirmBtnsEl.innerHTML = "";
  const ok = document.createElement("button");
  ok.className = "btn"; ok.textContent = "باشه";
  confirmBtnsEl.appendChild(ok);
  confirmOverlay.style.display = "flex";
  const close = () => { confirmOverlay.style.display = "none"; };
  ok.onclick = close;

/* هفته از شنبه شروع می‌شه */
function getWeekKey(date) {
  const since = (date.getDay() - 6 + 7) % 7;
  const ws = new Date(date);
  ws.setDate(date.getDate() - since);
  ws.setHours(0, 0, 0, 0);
  return ws.toISOString().slice(0, 10);
}
function checkWeeklyReset() {
  store.completedThisWeek = store.completedThisWeek || {};
  store.todos = store.todos || [];
  store.notTodos = store.notTodos || [];
  store.categories.forEach(c => { if (c.color === "#0F6E56") c.color = "#935073"; });
  if (!store.seededNot) {
    store.seededNot = true;
    if (!store.notTodos.length) store.notTodos.push({id: genId(), title: "اسکرول بیش از ۲ ساعت در روز", log: {}});
    saveStore();
  }
  const wk = getWeekKey(new Date());
  if (store.weekKey !== wk) {
    store.completedThisWeek = {};
    store.todos.forEach(t => t.done = false);
    store.weekKey = wk;
    saveStore();
  }
}

function categoryColor(catId) {
  const cat = store.categories.find(c => c.id === catId);
  return cat ? cat.color : "#999999";
}
function hexToRgba(hex, alpha) {
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderClock() {
  const tasks = store.tasks.filter(t => t.day === selectedDay).sort((a,b) => a.start - b.start);
  let stops = [], cursor = 0;
  tasks.forEach(t => {
    if (t.start > cursor) stops.push(`var(--color-free) ${pct(cursor)} ${pct(t.start)}`);
    const base = categoryColor(t.categoryId);
    const color = t.freq === "even" ? hexToRgba(base, 0.5) : base;
    stops.push(`${color} ${pct(t.start)} ${pct(t.end)}`);
    cursor = Math.max(cursor, t.end);
  });
  if (cursor < 24) stops.push(`var(--color-free) ${pct(cursor)} 100%`);
  clockFace.style.backgroundImage = stops.length ? `conic-gradient(from 0deg, ${stops.join(",")})` : "none";

  document.getElementById("dayName").textContent = selectedDay;
  const total = tasks.reduce((s,t) => s + (t.end - t.start), 0);
  const th = Math.floor(total), tm = Math.round((total - th) * 60);
  const totalText = tm ? `${fa(th)} ساعت و ${fa(tm)} دقیقه` : `${fa(th)} ساعت`;
  document.getElementById("dayTotal").textContent = tasks.length ? totalText + " درگیر" : "روز آزاد";
}

/* ---------- نشانگرهای دقیق ساعت روی صفحه‌ی ساعت ---------- */
function polar(radius, hourFraction) {
  const angleDeg = (hourFraction / 24) * 360;
  const rad = angleDeg * Math.PI / 180;
  return { x: radius * Math.sin(rad), y: -radius * Math.cos(rad) };
}
function buildHourMarks() {
  const marksEl = document.getElementById("hourMarks");
  marksEl.innerHTML = "";
  for (let h = 0; h < 24; h++) {
    const angleDeg = (h / 24) * 360;
    const tick = document.createElement("div");
    tick.className = "tick" + (h % 3 === 0 ? " major" : "");
    tick.style.transform = `translate(-50%,-50%) rotate(${angleDeg}deg) translateY(-142px)`;
    marksEl.appendChild(tick);
  }
  [0, 3, 6, 9, 12, 15, 18, 21].forEach(h => {
    const { x, y } = polar(120, h);
    const label = document.createElement("div");
    label.className = "hourLabel";
    label.style.left = `calc(50% + ${x}px)`;
    label.style.top = `calc(50% + ${y}px)`;
    label.style.transform = "translate(-50%,-50%)";
    let html = fa(h.toString().padStart(2, "0")) + ":۰۰";
    if (h === 6) html += `<span class="ampm">ق.ظ (AM)</span>`;
    if (h === 18) html += `<span class="ampm">ب.ظ (PM)</span>`;
    label.innerHTML = html;
    marksEl.appendChild(label);
  });
}
buildHourMarks();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todos = () => (store.todos = store.todos || []);
const nots = () => (store.notTodos = store.notTodos || []);
const dKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

function ringSVG(done, total) {
  const p = total ? done / total : 0, C = 2 * Math.PI * 21;
  return `<div class="ring"><svg width="54" height="54"><circle cx="27" cy="27" r="21" fill="none" stroke="var(--color-free)" stroke-width="6"/><circle cx="27" cy="27" r="21" fill="none" stroke="var(--color-accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(p*C).toFixed(1)} ${C.toFixed(1)}"/></svg><span>${total ? fa(Math.round(p*100)) + "٪" : "—"}</span></div>`;
}

function renderTodo() {
  const box = document.getElementById("todoDays");
  box.innerHTML = "";
  let allDone = 0, allTotal = 0;
  FA_DAYS.forEach(day => {
    const items = [
      ...store.tasks.filter(t => t.day === day).sort((a,b) => a.start - b.start)
        .map(t => ({id:t.id, title:t.title, done:!!store.completedThisWeek[t.id], kind:"s", time:faTime(t.start)})),
      ...todos().filter(t => t.day === day).map(t => ({id:t.id, title:t.title, done:!!t.done, kind:"x"}))
    ];
    const done = items.filter(i => i.done).length;
    allDone += done; allTotal += items.length;
    const rows = items.length ? items.map(i => `<div class="ckRow"><input type="checkbox" class="todoCheck" data-k="${i.kind}" data-id="${i.id}" ${i.done ? "checked" : ""}><span class="grow" style="${i.done ? "text-decoration:line-through;opacity:.55;" : ""}">${i.time ? i.time + " — " : ""}${esc(i.title)}</span>${i.kind === "x" ? `<button class="iconBtn" data-rm="${i.id}">✕</button>` : ""}</div>`).join("") : `<div class="emptyNote" style="text-align:right">کاری نیست</div>`;
    box.insertAdjacentHTML("beforeend", `<div class="card dayCard">${ringSVG(done, items.length)}<div class="grow"><b style="font-size:14px">${day}</b>${rows}</div></div>`);
  });
  document.getElementById("weekSummary").innerHTML = `<div class="dayCard">${ringSVG(allDone, allTotal)}<div><b>پیشرفت این هفته</b><div style="font-size:12px;color:var(--color-muted);margin-top:2px">${fa(allDone)} از ${fa(allTotal)} کار انجام شده — شنبه‌ها خودکار ریست می‌شه</div><button class="btn secondary" id="resetChecks" style="margin-top:8px;padding:5px 10px;font-size:11px">ریست تیک‌ها</button></div></div>`;
  box.querySelectorAll(".todoCheck").forEach(cb => cb.onchange = () => {
    if (cb.dataset.k === "s") store.completedThisWeek[cb.dataset.id] = cb.checked;
    else todos().find(t => t.id === cb.dataset.id).done = cb.checked;
    saveStore(); renderTodo(); renderDayList();
  });
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { store.todos = todos().filter(t => t.id !== b.dataset.rm); saveStore(); renderTodo(); });
  document.getElementById("resetChecks").onclick = async () => {
    if (!(await showConfirm("همه‌ی تیک‌های این هفته پاک بشن؟"))) return;
    store.completedThisWeek = {}; todos().forEach(t => t.done = false);
    saveStore(); renderTodo(); renderDayList();
  };
}

function streakOf(n) {
  const log = n.log || {}, d = new Date();
  let s = 0;
  if (!log[dKey(d)]) d.setDate(d.getDate() - 1);
  while (log[dKey(d)] === "held") { s++; d.setDate(d.getDate() - 1); }
  return s;
}
function renderNot() {
  const box = document.getElementById("notList");
  box.innerHTML = nots().length ? "" : `<div class="emptyNote">هنوز چیزی اضافه نکردی. یه عادتی که می‌خوای ازش دوری کنی بنویس.</div>`;
  const today = dKey(new Date());
  nots().forEach(n => {
    const log = n.log = n.log || {}, st = log[today];
    let dots = "";
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const v = log[dKey(d)];
      dots += `<span class="dot" style="width:10px;height:10px;background:${v === "held" ? "var(--color-accent)" : v === "slipped" ? "var(--color-danger)" : "var(--color-free)"}"></span>`;
    }
    box.insertAdjacentHTML("beforeend", `<div class="card"><div class="ckRow"><b class="grow" style="font-size:14px">🚫 ${esc(n.title)}</b><button class="iconBtn" data-rmn="${n.id}">🗑️</button></div><div style="font-size:12px;color:var(--color-muted);margin:2px 0 8px">🔥 ${fa(streakOf(n))} روز پشت‌سرهم</div><div style="display:flex;gap:4px;margin-bottom:10px">${dots}</div><div class="btnRow"><button class="btn ${st === "held" ? "" : "secondary"}" data-h="${n.id}">✓ نگه داشتم</button><button class="btn ${st === "slipped" ? "danger" : "secondary"}" data-s="${n.id}">✗ لغزیدم</button></div></div>`);
  });
  const set = (id, v) => {
    const n = nots().find(x => x.id === id);
    n.log = n.log || {};
    if (n.log[today] === v) delete n.log[today]; else n.log[today] = v;
    saveStore(); renderNot();
  };
  box.querySelectorAll("[data-h]").forEach(b => b.onclick = () => set(b.dataset.h, "held"));
  box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => set(b.dataset.s, "slipped"));
  box.querySelectorAll("[data-rmn]").forEach(b => b.onclick = async () => {
    if (!(await showConfirm("این مورد حذف بشه؟"))) return;
    store.notTodos = nots().filter(x => x.id !== b.dataset.rmn); saveStore(); renderNot();
  });
}

FA_DAYS.forEach(d => { const o = document.createElement("option"); o.value = d; o.textContent = d; document.getElementById("todoDay").appendChild(o); });
document.getElementById("todoForm").addEventListener("submit", e => {
  e.preventDefault();
  const t = document.getElementById("todoTitle");
  todos().push({id: genId(), title: t.value.trim(), day: document.getElementById("todoDay").value, done: false});
  t.value = ""; saveStore(); renderTodo();
});
document.getElementById("notForm").addEventListener("submit", e => {
  e.preventDefault();
  const t = document.getElementById("notTitle");
  nots().push({id: genId(), title: t.value.trim(), log: {}});
  t.value = ""; saveStore(); renderNot();
});
const ideas = () => {
  if (!store.ideas || store.ideas.length !== 5) store.ideas = ["short","short","short","long","long"].map(k => ({k, title:"", note:"", status:0}));
  return store.ideas;
};
function renderIdeas() {
  const sl = ideas(), S = ["ایده","اسکریپت آماده","ضبط شد","منتشر شد"];
  const pub = sl.filter(s => s.status === 3).length;
  const sat = new Date().getDay() === 6 ? "امروز شنبه‌ست، وقت ایده‌یابیه 💡" : "ایده‌یابی هر شنبه: ۳ شورت و ۲ ویدیوی لانگ";
  document.getElementById("ideasSummary").innerHTML = `<div class="dayCard">${ringSVG(pub, 5)}<div><b>ایده‌یابی ویدیو</b><div style="font-size:12px;color:var(--color-muted);margin-top:2px">${sat} — ${fa(pub)} از ۵ منتشر شده</div><button class="btn secondary" id="ideasNew" style="margin-top:8px;padding:5px 10px;font-size:11px">شروع هفته‌ی جدید</button></div></div>`;
  const box = document.getElementById("ideasList");
  box.innerHTML = sl.map((s, i) => `<div class="card"><div class="ckRow"><b class="grow" style="font-size:14px">${s.k === "short" ? "🎬 شورت " + fa(i + 1) : "🎥 لانگ " + fa(i - 2)}</b><select class="ideaIn" data-st="${i}">${S.map((x, j) => `<option value="${j}" ${s.status === j ? "selected" : ""}>${x}</option>`).join("")}</select></div><input type="text" class="ideaIn" data-ti="${i}" placeholder="عنوان / ایده‌ی اصلی" value="${esc(s.title)}" style="margin:8px 0"><textarea class="ideaIn" data-no="${i}" rows="3" placeholder="هوک، نکات، ریف‌ها...">${esc(s.note)}</textarea></div>`).join("");
  box.querySelectorAll("[data-ti]").forEach(el => el.oninput = () => { sl[el.dataset.ti].title = el.value; saveStore(); });
  box.querySelectorAll("[data-no]").forEach(el => el.oninput = () => { sl[el.dataset.no].note = el.value; saveStore(); });
  box.querySelectorAll("[data-st]").forEach(el => el.onchange = () => { sl[el.dataset.st].status = Number(el.value); saveStore(); renderIdeas(); });
  document.getElementById("ideasNew").onclick = async () => {
    if (!(await showConfirm("همه‌ی ۵ ایده پاک بشن و هفته‌ی جدید شروع بشه؟"))) return;
    store.ideas = null; saveStore(); renderIdeas();
  };
}
document.getElementById("navPanel").onclick = () => openPanel();
function moveBall() {
  const act = document.querySelector("#tabBar .bar button.active");
  if (!act) return;
  const bar = document.querySelector("#tabBar .bar"), r = act.getBoundingClientRect(), br = bar.getBoundingClientRect();
  const x = r.left - br.left + r.width / 2;
  bar.style.setProperty("--nx", x + "px");
  const fab = document.getElementById("fab");
  fab.style.left = x + "px";
  fab.textContent = act.querySelector("b").textContent;
}
window.addEventListener("resize", moveBall);
window.addEventListener("load", moveBall);
function showPage(name) {
  ["Schedule","Todo","Not","Ideas"].forEach(p => document.getElementById("page" + p).style.display = p === name ? "" : "none");
  document.querySelectorAll("#tabBar button").forEach(b => b.classList.toggle("active", b.dataset.page === name));
  if (name === "Todo") renderTodo();
  if (name === "Not") renderNot();
  if (name === "Ideas") renderIdeas();
  moveBall();
}
document.querySelectorAll("#tabBar button[data-page]").forEach(b => b.onclick = () => showPage(b.dataset.page));
showPage("Schedule");

/* ---------- رندر کلی ---------- */
function renderAll() {
  renderDayTabs();
  renderClock();
  renderLegend();
  renderDayList();
  renderTodo();
  renderNot();
  renderIdeas();
  renderCategorySelect();
  renderCategoryList();
  renderTaskListAll();
}
renderAll();
</script>
